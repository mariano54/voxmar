[package]
name = "voxmar_worldgen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
voxmar_engine.workspace = true
fastnoise-lite.workspace = true
tracing.workspace = true
serde.workspace = true
ron.workspace = true
rustc-hash.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Region builds' helper threads take their caller's scheduling class (parallel.rs).
libc = "0.2"

[dev-dependencies]
# Thread CPU time for the generation benchmark, which stays meaningful on a busy machine.
libc = "0.2"
# The tests that sweep a world sample it on every core: the gate waits for the slowest one.
rayon.workspace = true
