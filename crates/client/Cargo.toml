[package]
name = "voxmar_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "voxmar"
path = "src/main.rs"

[features]
tracy = ["bevy/trace_tracy"]
chrome = ["bevy/trace_chrome"]

[dependencies]
libc = "0.2"
# The screenshot key: the frame to the clipboard as an image, and saved as a PNG.
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }
# Bevy's own wgpu, for what Bevy does not re-export (timestamp query sets).
wgpu = { version = "29", default-features = false }
voxmar_engine.workspace = true
voxmar_protocol.workspace = true
voxmar_server.workspace = true
voxmar_worldgen.workspace = true
voxmar_texgen.workspace = true
# Bevy's text layout, for its font fallback (see lang.rs); the version Bevy uses.
parley = { version = "0.9", default-features = false }
# Only the parts in use: every plugin adds systems and render graph nodes that run each
# frame whether or not anything uses them.
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_anti_alias",
    "smaa_luts",
    "zstd_rust",
    "bevy_light",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "png",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_audio",
    "mp3",
    "wav",
    # Block sounds read from the player's Minecraft install (see sfx/minecraft.rs).
    "symphonia-vorbis",
] }
crossbeam-channel.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
bytemuck.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
# The system's language, for the first run (bevy_text already builds it).
sys-locale = "0.3"
tracing.workspace = true
zip.workspace = true
# Checksums of borrowed music files, to tell copies apart (music/prism.rs).
crc32fast = "1.5"
# Bevy's audio decoder, to check a borrowed track decodes before it plays (music.rs).
rodio = { version = "0.22.2", default-features = false }

[dev-dependencies]
# Already in the tree under Bevy: `render/shader_check.rs` composes and validates the
# terrain shader with it, as the renderer would, without a GPU.
naga_oil = { version = "0.22", default-features = false }
