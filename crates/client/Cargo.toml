[package]
name = "voxmar_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "voxmar"
path = "src/main.rs"

[features]
tracy = ["bevy/trace_tracy"]

[dependencies]
voxmar_engine.workspace = true
voxmar_protocol.workspace = true
voxmar_server.workspace = true
voxmar_worldgen.workspace = true
voxmar_texgen.workspace = true
# Only the parts in use: every plugin adds systems and render graph nodes that run each
# frame whether or not anything uses them.
bevy = { workspace = true, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_anti_alias",
    "smaa_luts",
    "zstd_rust",
    "bevy_light",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "png",
    "bevy_text",
    "default_font",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_audio",
    "mp3",
    "wav",
] }
crossbeam-channel.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
bytemuck.workspace = true
ron.workspace = true
serde.workspace = true
tracing.workspace = true
zip.workspace = true
