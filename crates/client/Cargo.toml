[package]
name = "voxmar_client"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "voxmar"
path = "src/main.rs"

[features]
tracy = ["bevy/trace_tracy"]

[dependencies]
voxmar_engine.workspace = true
voxmar_protocol.workspace = true
voxmar_server.workspace = true
bevy = { workspace = true, features = ["3d", "ui"] }
crossbeam-channel.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
tracing.workspace = true
zip.workspace = true
png.workspace = true
