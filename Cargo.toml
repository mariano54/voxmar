[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo run` starts the game. Use `-p voxmar_server` for the dedicated server and
# `--workspace` to build or test everything.
default-members = ["crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
voxmar_engine = { path = "crates/engine" }
voxmar_worldgen = { path = "crates/worldgen" }
voxmar_protocol = { path = "crates/protocol" }
voxmar_server = { path = "crates/server" }
voxmar_texgen = { path = "crates/texgen" }

bevy = { version = "0.19.1", default-features = false }
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
ron = "0.12"
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
rayon = "1.12"
fastnoise-lite = "1.1"
crossbeam-channel = "0.5"
tracing = "0.1"
rustc-hash = "2"
bytemuck = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
# The backend zip's `deflate` feature already uses.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
png = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The shipped build: whole-program optimisation, slow to link. Use it for performance
# measurements and anything compared against them.
[profile.release]
codegen-units = 1
lto = "thin"

# Day-to-day optimised builds (`--profile iter`): incremental and without cross-crate LTO,
# so a small edit relinks in seconds instead of minutes. Generation runs ~5-10% slower
# than release, which is fine for captures, previews and tests but not for perf numbers.
[profile.iter]
inherits = "release"
codegen-units = 256
lto = false
incremental = true
# With debuginfo off, cargo strips by default (`strip = "debuginfo"`), which on macOS runs the
# strip tool once per binary after each link, about 30 runs a gate. The gate never ships these
# binaries, so keep what the linker wrote: same code, only bigger files. The play build (release)
# still strips.
strip = "none"
