[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
voxmar_engine = { path = "crates/engine" }
voxmar_worldgen = { path = "crates/worldgen" }
voxmar_protocol = { path = "crates/protocol" }
voxmar_server = { path = "crates/server" }

bevy = { version = "0.19.1", default-features = false }
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
ron = "0.12"
postcard = { version = "1", features = ["use-std"] }
rayon = "1.12"
fastnoise-lite = "1.1"
crossbeam-channel = "0.5"
tracing = "0.1"
rustc-hash = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
png = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
