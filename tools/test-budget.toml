# Test time budgets, checked by tools/test-times (docs/quality.md, "Fast tests").
#
# Times are those of the test harness while the gate runs all the test binaries side by side,
# so a test may take its budget times how loaded the machine is (the gate passes that).
per_test_seconds = 5
# The slowest test binary, in seconds: worldgen's, whose tests run on all cores. Aim: 60.
# Lower these in the change that makes the tests faster. `full_suite_seconds` is for
# `tools/gate --full`, which also runs the tests the default gate skips.
suite_seconds = 400
full_suite_seconds = 900
#
# A test over `per_test_seconds` is named here, with the seconds it may take (one and a half
# times what it took when measured on 2026-10-13, up to the next of 10, 20, 45, 70, 100, 150,
# 200, 300, 500, 900 or 1500) and why. Before adding one, ask whether the test can be made
# cheaper. Delete its entry in the change that makes it cheap: test-times fails on an entry
# the test no longer needs.


[[allow]]
binary = "gameplay"
seconds = 10
why = "Judged by the wall clock (combat, timed actions, movement and idle checks stamp arrivals in real seconds), so the test is run with real_time() and its waits are real seconds. Gone with a virtual server clock."
tests = [
  "a_player_silent_in_mid_jump_lands_without_being_pulled_back",
  "a_swing_is_dropped_when_its_weapon_leaves_the_hand",
  "fires_warm_and_water_chills",
  "joining_again_takes_what_the_silent_session_held_not_an_older_file",
]

